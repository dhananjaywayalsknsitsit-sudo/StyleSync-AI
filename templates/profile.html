{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}
<div class="narrow"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>Your profile</h1><form class="form-card" method="post"><label>Name</label><input name="name" value="{{ user.name }}" required><label>Email</label><input value="{{ user.email }}" disabled><label>Preferred fashion style</label><select name="style">{% for s in ['casual','formal','streetwear','ethnic'] %}<option value="{{ s }}" {% if user.style == s %}selected{% endif %}>{{ s|title }}</option>{% endfor %}</select><button class="btn primary full">Save profile</button></form></div>
{% endblock %}
